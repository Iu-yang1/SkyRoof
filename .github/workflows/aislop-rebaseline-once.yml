name: One-time reviewed aislop baseline relocation
on:
  push:
    branches: [quality/reviewed-aislop-baseline-20261104]
    paths: [.github/workflows/aislop-rebaseline-once.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.ref == 'refs/heads/quality/reviewed-aislop-baseline-20261104'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install deterministic analyzers
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          python3 -m venv "$RUNNER_TEMP/aislop-python"
          "$RUNNER_TEMP/aislop-python/bin/python" -m pip install --quiet ruff==0.14.2
          echo "$RUNNER_TEMP/aislop-python/bin" >> "$GITHUB_PATH"
      - name: Regenerate and review historical diagnosis locations
        shell: bash
        run: |
          set -euo pipefail
          cp .aislop/ci-baseline.json "$RUNNER_TEMP/aislop-baseline-before.json"
          rm .aislop/ci-baseline.json
          npm exec --yes --package=aislop@0.18.1 -- aislop baseline write
          test -s .aislop/ci-baseline.json
          node - <<'JS'
          const fs=require('fs');
          const before=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/aislop-baseline-before.json'));
          const after=JSON.parse(fs.readFileSync('.aislop/ci-baseline.json'));
          const key=x=>x.engine+'|'+x.rule+'|'+x.file+'|'+x.fingerprint;
          const old=new Set(before.entries.map(key));
          const added=after.entries.filter(x=>!old.has(key(x)));
          const safe=new Set([
            'complexity/function-too-long|SkyRoof/AFC/AfcController.cs',
            'ai-slop/unreachable-code|SkyRoof/CAT/ControlEngine.cs',
            'ai-slop/csharp-index-loop|SkyRoof/AFC/AfcSignalProcessing.Ssb.cs'
          ]);
          console.log('Prior baseline',before.entries.length,'updated',after.entries.length);
          console.log('Relocated entries',JSON.stringify(added));
          if(added.length!==4 || added.some(x=>!safe.has(x.rule+'|'+x.file))) {
            console.error('Unexpected new quality finding: refusing baseline refresh');
            process.exit(1);
          }
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .aislop/ci-baseline.json
          git commit -m 'chore(quality): review moved diagnostics and prune stale baseline entries'
          git push origin HEAD:refs/heads/quality/reviewed-aislop-baseline-20261104
