name: Deploy DocFX Site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docfx.yml'
  workflow_dispatch:

# Upload an artifact and call the official Pages API. Pushing to gh-pages with
# GITHUB_TOKEN alone does not trigger GitHub's branch-based Pages publication.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build DocFX HTML
        run: docfx build docs/docfx.json

      - name: Build PDF
        run: docfx pdf docs/docfx.json

      - name: Verify English and Chinese entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/_site/index.html
          test -s docs/_site/fork-guide/overview.html
          test -s docs/_site/zh-cn/fork-guide/overview.html
          test -s docs/_site/fork-guide/spectrum.html
          test -s docs/_site/zh-cn/fork-guide/spectrum.html
          test -s docs/_site/users_guide/cw_console.html
          test -s docs/_site/zh-cn/users_guide/cw_console.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
