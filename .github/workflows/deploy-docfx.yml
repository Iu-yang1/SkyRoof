name: Deploy DocFX Site to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docfx.yml'
  workflow_dispatch:

# The legacy gh-pages publishing action requires write access to contents.
# A named job environment creates a real GitHub Deployment with a site URL.
permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://iu-yang1.github.io/SkyRoof/

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build DocFX site
        run: docfx build docs/docfx.json
        
      - name: Build PDF
        run: docfx pdf docs/docfx.json

      # This step publishes the built DocFX HTML to the already configured
      # gh-pages branch. The job's github-pages environment records a
      # visible deployment and public site URL in the repository sidebar.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
          publish_branch: gh-pages
