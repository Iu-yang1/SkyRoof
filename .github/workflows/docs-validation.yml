name: Docs Validation

on:
  pull_request:
    branches: [master]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/deploy-docfx.yml'
      - '.github/workflows/docs-validation.yml'
      - 'benchmarks/cw-recorded-corpus/**'
      - 'scripts/validate-cw-release.ps1'
      - 'licenses/DeepCW-NOTICE.txt'
      - 'licenses/HamNoise-NOTICE.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docfx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify bilingual README language switches
        shell: bash
        run: |
          test -s README.md
          test -s README.zh-CN.md
          grep -Fq '[简体中文](README.zh-CN.md)' README.md
          grep -Fq '[English](README.md)' README.zh-CN.md
          grep -Fq '## Fork extensions' README.md
          grep -Fq '## Fork 扩展功能' README.zh-CN.md
      - name: Validate CW docs/corpus release inputs
        shell: pwsh
        run: ./scripts/validate-cw-release.ps1 -DocsOnly
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '9.0.x'
      - name: Install DocFX
        run: dotnet tool install -g docfx
      - name: Build English/Chinese documentation
        run: docfx build docs/docfx.json
      - name: Check published language entry points
        shell: bash
        run: |
          test -s docs/_site/index.html
          test -s docs/_site/fork-guide/overview.html
          test -s docs/_site/zh-cn/fork-guide/overview.html
          test -s docs/_site/fork-guide/spectrum.html
          test -s docs/_site/zh-cn/fork-guide/spectrum.html
          test -s docs/_site/users_guide/cw_console.html
          test -s docs/_site/zh-cn/users_guide/cw_console.html
