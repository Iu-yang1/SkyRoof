name: Compile Check

on:
  push:
    branches:
      - master
      - feature/base-frequency-tuning
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Restore NuGet packages
        run: nuget restore SkyRoof.sln

      - name: Build solution
        run: msbuild SkyRoof.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Install Inno Setup
        shell: powershell
        run: choco upgrade innosetup --yes --no-progress

      - name: Build unsigned test installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "install\SkyRoof.iss"'

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: SkyRoof-base-frequency-test-installer
          path: install/Output/SkyRoofSetup.exe
          if-no-files-found: error
