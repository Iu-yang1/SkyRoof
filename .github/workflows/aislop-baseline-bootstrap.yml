name: Bootstrap aislop accepted-findings baseline
on:
  push:
    branches: [quality/p3-aislop-gate]
    paths: ['.github/workflows/aislop-baseline-bootstrap.yml']
permissions:
  contents: write
jobs:
  snapshot:
    if: github.ref == 'refs/heads/quality/p3-aislop-gate'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install native/static tooling
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          python3 -m venv "$RUNNER_TEMP/aislop-python"
          "$RUNNER_TEMP/aislop-python/bin/python" -m pip install --disable-pip-version-check --quiet ruff==0.14.2
          echo "$RUNNER_TEMP/aislop-python/bin" >> "$GITHUB_PATH"
      - name: Generate deterministic pinned baseline once
        shell: bash
        run: |
          set -euo pipefail
          if test -e .aislop/ci-baseline.json; then
            echo "Baseline already exists; refusing to overwrite it"
            exit 0
          fi
          npm exec --yes --package=aislop@0.18.1 -- aislop baseline write
          test -s .aislop/ci-baseline.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .aislop/ci-baseline.json
          git commit -m 'chore(quality): capture reviewed v0.18.1 findings baseline'
          git push origin HEAD:refs/heads/quality/p3-aislop-gate
